name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Project Structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ahm --project-name tasbih .

      - name: Setup Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Configure Android Permissions, Desugaring & Signing
        run: |
          # ১. অ্যাপ লেবেল সেট করা
          sed -i 's/android:label="[^"]*"/android:label="Tasbih"/g' android/app/src/main/AndroidManifest.xml
          
          # ২. নোটিফিকেশন ও অ্যালার্মের জন্য ব্যাকগ্রাউন্ড পারমিশন যুক্ত করা
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\
          <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>' android/app/src/main/AndroidManifest.xml

          # ৩. রিলিজ সাইনিং ও desugaring কনফিগারেশন ইনজেকশন
          python3 -c "
          p = 'android/app/build.gradle.kts'
          try:
              with open(p, 'r') as f:
                  c = f.read()

              # রিলিজ সাইনিং ফিক্স
              c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')

              # Core library desugaring সক্রিয় করা
              c = c.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')

              # Desugar লাইব্রেরি ডিপেনডেন্সি যোগ করা
              if 'dependencies {' in c:
                  c = c.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")')
              else:
                  c += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'

              with open(p, 'w') as f:
                  f.write(c)
          except Exception as e:
              print('Error:', e)
          "

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
