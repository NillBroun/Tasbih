name: Build Universal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Complete Flutter Project
        run: |
          cd ..
          flutter create --org com.ahm --project-name tasbih temp_app
          cp -r Tasbih/lib/* temp_app/lib/
          cp -r Tasbih/assets temp_app/
          cp Tasbih/pubspec.yaml temp_app/pubspec.yaml
          
          # Inject vibration permission
          sed -i '/<application/i \    <uses-permission android:name="android.permission.VIBRATE"/>' temp_app/android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: |
          cd ../temp_app
          flutter pub get

      - name: Generate App Icons
        run: |
          cd ../temp_app
          flutter pub run flutter_launcher_icons

      - name: Build Universal APK
        run: |
          cd ../temp_app
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-APK
          path: ../temp_app/build/app/outputs/flutter-apk/app-debug.apk
