name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Project Structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ahm --project-name tasbih .

      - name: Setup Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Set App Label to Tasbih & Release Signing
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Tasbih"/g' android/app/src/main/AndroidManifest.xml

          python3 -c "
          p = 'android/app/build.gradle.kts'
          try:
              with open(p, 'r') as f:
                  c = f.read()
              c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
              with open(p, 'w') as f:
                  f.write(c)
          except:
              pass
          "

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
