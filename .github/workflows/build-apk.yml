name: Build Universal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Generate Click Audio Asset Automatically
      run: |
        mkdir -p assets/audio
        python3 -c "
        import wave, struct, math
        sample_rate = 44100
        duration = 0.035
        n_samples = int(sample_rate * duration)
        with wave.open('assets/audio/click.wav', 'w') as f:
            f.setnchannels(1)
            f.setsampwidth(2)
            f.setframerate(sample_rate)
            for i in range(n_samples):
                t = float(i) / sample_rate
                val = math.sin(2.0 * math.pi * 1200.0 * t) * math.exp(-i / (sample_rate * 0.007))
                sample = int(val * 32767)
                f.writeframes(struct.pack('<h', max(-32768, min(32767, sample))))
        "

    - name: Install dependencies
      run: flutter pub get

    - name: Build Universal APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tasbih-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
