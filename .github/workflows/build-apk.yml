name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Project Structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ahm --project-name tasbih .

      - name: Setup Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Inject Android Native Widget Files
        run: |
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable

          cat << 'EOF' > android/app/src/main/res/drawable/widget_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="28dp" />
              <solid android:color="#E6222428" />
              <stroke android:width="1dp" android:color="#3C4043" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_container"
              android:layout_width="match_parent"
              android:layout_height="56dp"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:background="@drawable/widget_background"
              android:paddingStart="16dp"
              android:paddingEnd="16dp">

              <LinearLayout
                  android:id="@+id/widget_counter_action"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📿"
                      android:textSize="14sp" />
                  <TextView
                      android:id="@+id/widget_count_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Today: 0"
                      android:textColor="#00B074"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:layout_marginStart="4dp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:gravity="center">
                  <TextView
                      android:id="@+id/widget_status_icon"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="☀️"
                      android:textSize="14sp" />
                  <TextView
                      android:id="@+id/widget_status_title"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Salah Open"
                      android:textColor="#888888"
                      android:textSize="9sp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="end">
                  <TextView
                      android:id="@+id/widget_hijri_date"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Hijri Date"
                      android:textColor="#FFFFFF"
                      android:textSize="11sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/widget_greg_date"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Date"
                      android:textColor="#AAAAAA"
                      android:textSize="9sp" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/tasbih_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="48dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_layout"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen" />
          EOF

          mkdir -p android/app/src/main/kotlin/com/ahm/tasbih
          cat << 'EOF' > android/app/src/main/kotlin/com/ahm/tasbih/TasbihWidgetProvider.kt
          package com.ahm.tasbih

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews

          class TasbihWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  try {
                      val pkg = context.packageName
                      val prefs: SharedPreferences = context.getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)

                      val layoutId = context.resources.getIdentifier("widget_layout", "layout", pkg)
                      val countId = context.resources.getIdentifier("widget_count_text", "id", pkg)
                      val hijriId = context.resources.getIdentifier("widget_hijri_date", "id", pkg)
                      val gregId = context.resources.getIdentifier("widget_greg_date", "id", pkg)
                      val iconId = context.resources.getIdentifier("widget_status_icon", "id", pkg)
                      val titleId = context.resources.getIdentifier("widget_status_title", "id", pkg)

                      if (layoutId == 0) return

                      for (widgetId in appWidgetIds) {
                          val views = RemoteViews(pkg, layoutId)

                          val count = prefs.getLong("flutter.widget_today_count", 0L)
                          val hijri = prefs.getString("flutter.widget_hijri_date", "Hijri Date") ?: "Hijri Date"
                          val greg = prefs.getString("flutter.widget_greg_date", "") ?: ""
                          val icon = prefs.getString("flutter.widget_status_icon", "☀️") ?: "☀️"
                          val title = prefs.getString("flutter.widget_status_title", "Salah Open") ?: "Salah Open"

                          if (countId != 0) views.setTextViewText(countId, "Today: $count")
                          if (hijriId != 0) views.setTextViewText(hijriId, hijri)
                          if (gregId != 0) views.setTextViewText(gregId, greg)
                          if (iconId != 0) views.setTextViewText(iconId, icon)
                          if (titleId != 0) views.setTextViewText(titleId, title)

                          appWidgetManager.updateAppWidget(widgetId, views)
                      }
                  } catch (e: Exception) {}
              }
          }
          EOF

      - name: Configure Android Manifest and Signing
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Tasbih"/g' android/app/src/main/AndroidManifest.xml

          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          receiver_xml = '''
              <receiver android:name=\"com.ahm.tasbih.TasbihWidgetProvider\" android:exported=\"true\">
                  <intent-filter>
                      <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />
                  </intent-filter>
                  <meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/tasbih_widget_info\" />
              </receiver>
          </application>'''
          c = c.replace('</application>', receiver_xml)
          with open(p, 'w') as f:
              f.write(c)
          "

          python3 -c "
          p = 'android/app/build.gradle.kts'
          try:
              with open(p, 'r') as f:
                  c = f.read()
              c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
              with open(p, 'w') as f:
                  f.write(c)
          except:
              pass
          "

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
