name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Project Structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ahm --project-name tasbih .

      - name: Setup Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Configure 4x1 Home Screen Widget
        run: |
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/kotlin/com/ahm/tasbih

          # ১. উইজেট XML লেআউট
          cat << 'EOF' > android/app/src/main/res/layout/glance_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:background="@drawable/widget_pill_background"
              android:paddingStart="16dp"
              android:paddingEnd="16dp"
              android:paddingTop="8dp"
              android:paddingBottom="8dp">

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:gravity="start|center_vertical"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/widget_tasbih_icon"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📿"
                      android:textSize="14sp" />

                  <TextView
                      android:id="@+id/widget_tasbih_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="4dp"
                      android:text="Today: 0"
                      android:textColor="#00B074"
                      android:textSize="13sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/status_pill_container"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:background="@drawable/status_pill_default"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:paddingTop="4dp"
                  android:paddingBottom="4dp">

                  <TextView
                      android:id="@+id/widget_status_icon"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="☀️"
                      android:textSize="14sp" />

                  <TextView
                      android:id="@+id/widget_status_title"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Salah Open"
                      android:textColor="#FFFFFF"
                      android:textSize="10sp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1.2"
                  android:gravity="end|center_vertical"
                  android:orientation="vertical">

                  <TextView
                      android:id="@+id/widget_hijri_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Hijri Date"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/widget_gregorian_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Gregorian"
                      android:textColor="#9E9E9E"
                      android:textSize="10sp" />
              </LinearLayout>
          </LinearLayout>
          EOF

          # ২. ড্রয়েবল ব্যাকগ্রাউন্ড শেপসমূহ
          cat << 'EOF' > android/app/src/main/res/drawable/widget_pill_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#D91A1C1E" />
              <corners android:radius="30dp" />
              <stroke android:width="1dp" android:color="#26FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/status_pill_default.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#20FFFFFF" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/status_pill_red.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#D32F2F" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/status_pill_green.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#00B074" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          # ৩. উইজেট ইনফো কনফিগারেশন XML
          cat << 'EOF' > android/app/src/main/res/xml/glance_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="40dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/glance_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # ৪. GlanceWidgetProvider Kotlin ক্লাস (অ্যাপ লঞ্চ ও কালার সিঙ্ক সহ)
          cat << 'EOF' > android/app/src/main/kotlin/com/ahm/tasbih/GlanceWidgetProvider.kt
          package com.ahm.tasbih

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborries.home_widget.HomeWidgetProvider
          import com.ahm.tasbih.R

          class GlanceWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray,
                  widgetData: SharedPreferences
              ) {
                  for (appWidgetId in appWidgetIds) {
                      val views = RemoteViews(context.packageName, R.layout.glance_widget_layout).apply {
                          val todayCount = widgetData.getInt("today_count", 0)
                          val statusIcon = widgetData.getString("status_icon", "☀️") ?: "☀️"
                          val statusTitle = widgetData.getString("status_title", "Salah Open") ?: "Salah Open"
                          val hijriText = widgetData.getString("hijri_date", "") ?: ""
                          val gregorianText = widgetData.getString("gregorian_date", "") ?: ""
                          val pillState = widgetData.getString("status_pill_state", "DEFAULT") ?: "DEFAULT"

                          setTextViewText(R.id.widget_tasbih_text, "Today: $todayCount")
                          setTextViewText(R.id.widget_status_icon, statusIcon)
                          setTextViewText(R.id.widget_status_title, statusTitle)
                          setTextViewText(R.id.widget_hijri_text, hijriText)
                          setTextViewText(R.id.widget_gregorian_text, gregorianText)

                          when (pillState) {
                              "RED" -> setInt(R.id.status_pill_container, "setBackgroundResource", R.drawable.status_pill_red)
                              "GREEN" -> setInt(R.id.status_pill_container, "setBackgroundResource", R.drawable.status_pill_green)
                              else -> setInt(R.id.status_pill_container, "setBackgroundResource", R.drawable.status_pill_default)
                          }

                          val launchIntent = context.packageManager.getLaunchIntentForPackage(context.packageName)
                          if (launchIntent != null) {
                              val pendingIntent = PendingIntent.getActivity(
                                  context,
                                  0,
                                  launchIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                              )
                              setOnClickPendingIntent(R.id.widget_root, pendingIntent)
                          }
                      }
                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          EOF

          # ৫. AndroidManifest.xml-এ রিসিভার যোগ করা (কোনো ডুপ্লিকেট ছাড়া)
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()

          receiver = '''
                  <receiver
                      android:name=\"com.ahm.tasbih.GlanceWidgetProvider\"
                      android:exported=\"true\">
                      <intent-filter>
                          <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />
                      </intent-filter>
                      <meta-data
                          android:name=\"android.appwidget.provider\"
                          android:resource=\"@xml/glance_widget_info\" />
                  </receiver>
          '''
          if 'GlanceWidgetProvider' not in c:
              c = c.replace('</application>', receiver + '\n    </application>')
              with open(p, 'w') as f:
                  f.write(c)
          "

      - name: Set App Label to Tasbih & Release Signing
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Tasbih"/g' android/app/src/main/AndroidManifest.xml

          python3 -c "
          import os
          for p in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      c = f.read()
                  if 'signingConfig = signingConfigs' not in c and 'signingConfig signingConfigs' not in c:
                      if p.endswith('.kts'):
                          c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
                      else:
                          c = c.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }')
                      with open(p, 'w') as f:
                          f.write(c)
          "

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
