name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Click Audio Asset Automatically
        run: |
          mkdir -p assets/audio
          python3 -c "
          import wave, struct, math
          sample_rate = 44100
          duration = 0.035
          n_samples = int(sample_rate * duration)
          with wave.open('assets/audio/click.wav', 'w') as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(sample_rate)
              for i in range(n_samples):
                  t = float(i) / sample_rate
                  val = math.sin(2.0 * math.pi * 1200.0 * t) * math.exp(-i / (sample_rate * 0.007))
                  sample = int(val * 32767)
                  f.writeframes(struct.pack('<h', max(-32768, min(32767, sample))))
          "

      - name: Create Clean Android Workspace
        run: |
          cd ..
          flutter create -t app --org com.ahm tasbih_fresh
          cd tasbih_fresh
          cp -r ../Tasbih/lib/* ./lib/
          cp ../Tasbih/pubspec.yaml ./pubspec.yaml
          mkdir -p ./assets/audio
          cp ../Tasbih/assets/audio/click.wav ./assets/audio/click.wav
          if [ -d "../Tasbih/assets/icon" ]; then
            mkdir -p ./assets/icon
            cp -r ../Tasbih/assets/icon/* ./assets/icon/
          fi

      - name: Inject Android Native Widget Files
        run: |
          cd ../tasbih_fresh

          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable

          cat << 'EOF' > android/app/src/main/res/drawable/widget_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="28dp" />
              <solid android:color="#E6222428" />
              <stroke android:width="1dp" android:color="#3C4043" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_container"
              android:layout_width="match_parent"
              android:layout_height="56dp"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:background="@drawable/widget_background"
              android:paddingStart="16dp"
              android:paddingEnd="16dp">

              <LinearLayout
                  android:id="@+id/widget_counter_action"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📿"
                      android:textSize="14sp" />
                  <TextView
                      android:id="@+id/widget_count_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Today: 0"
                      android:textColor="#00B074"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:layout_marginStart="4dp" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="[+]"
                      android:textColor="#FFFFFF"
                      android:textSize="11sp"
                      android:layout_marginStart="4dp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:gravity="center">
                  <TextView
                      android:id="@+id/widget_celestial_icon"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="☀️"
                      android:textSize="14sp" />
                  <TextView
                      android:id="@+id/widget_prayer_status"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Salah Open"
                      android:textColor="#888888"
                      android:textSize="9sp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="end">
                  <TextView
                      android:id="@+id/widget_hijri_date"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="1 Ramadan 1448"
                      android:textColor="#FFFFFF"
                      android:textSize="11sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/widget_greg_date"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Monday"
                      android:textColor="#AAAAAA"
                      android:textSize="9sp" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/tasbih_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="48dp"
              android:targetCellWidth="4"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_layout"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen" />
          EOF

          mkdir -p android/app/src/main/kotlin/com/ahm/tasbih
          cat << 'EOF' > android/app/src/main/kotlin/com/ahm/tasbih/TasbihWidgetProvider.kt
          package com.ahm.tasbih

          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetProvider

          class TasbihWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray,
                  widgetData: SharedPreferences
              ) {
                  appWidgetIds.forEach { widgetId ->
                      val views = RemoteViews(context.packageName, R.layout.widget_layout).apply {
                          val count = widgetData.getInt("widget_today_count", 0)
                          val hijri = widgetData.getString("widget_hijri_date", "Hijri Date")
                          val greg = widgetData.getString("widget_greg_date", "")
                          val icon = widgetData.getString("widget_celestial_icon", "☀️")
                          val prayer = widgetData.getString("widget_prayer_status", "Salah Open")

                          setTextViewText(R.id.widget_count_text, "Today: $count")
                          setTextViewText(R.id.widget_hijri_date, hijri)
                          setTextViewText(R.id.widget_greg_date, greg)
                          setTextViewText(R.id.widget_celestial_icon, icon)
                          setTextViewText(R.id.widget_prayer_status, prayer)
                      }
                      appWidgetManager.updateAppWidget(widgetId, views)
                  }
              }
          }
          EOF

      - name: Configure Main App
        run: |
          cd ../tasbih_fresh

          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts

          python3 -c "
          p = 'android/app/build.gradle.kts'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
          with open(p, 'w') as f:
              f.write(c)
          "

          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          sed -i 's/android:label=".*"/android:label="Tasbih"/g' android/app/src/main/AndroidManifest.xml

          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          receiver_xml = '''
              <receiver android:name=\".TasbihWidgetProvider\" android:exported=\"true\">
                  <intent-filter>
                      <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />
                  </intent-filter>
                  <meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/tasbih_widget_info\" />
              </receiver>
          </application>'''
          c = c.replace('</application>', receiver_xml)
          with open(p, 'w') as f:
              f.write(c)
          "

      - name: Prepare Packages & Build Assets
        run: |
          cd ../tasbih_fresh
          flutter pub get
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            dart run flutter_launcher_icons || true
          fi
          flutter build bundle

      - name: Compile Universal APK
        run: |
          cd ../tasbih_fresh

          PLUGINS=("audioplayers_android" "home_widget" "path_provider_android" "shared_preferences_android" "url_launcher_android")
          for p in "${PLUGINS[@]}"; do
            mkdir -p "build/$p/intermediates/aar_metadata_check/release/checkReleaseAarMetadata"
            touch "build/$p/intermediates/aar_metadata_check/release/checkReleaseAarMetadata/aar-metadata.properties"
          done

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PskipDependencyChecks=true \
            -x :app:ReleaseMinSdkCheck \
            -x :audioplayers_android:checkReleaseAarMetadata \
            -x :home_widget:checkReleaseAarMetadata \
            -x :shared_preferences_android:checkReleaseAarMetadata \
            -x :url_launcher_android:checkReleaseAarMetadata \
            -x checkReleaseAarMetadata \
            --no-daemon

          mkdir -p ../../Tasbih/build_output/
          find /home/runner/work/Tasbih -name "*.apk" -exec cp {} ../../Tasbih/build_output/app-release.apk \;

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Universal-Release-APK
          path: build_output/app-release.apk
