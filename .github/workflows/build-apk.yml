name: Build Universal Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Flutter Project
        run: |
          cd ..
          flutter create --org com.ahm --project-name tasbih temp_app
          cp -r Tasbih/lib/* temp_app/lib/
          cp -r Tasbih/assets temp_app/
          cp Tasbih/pubspec.yaml temp_app/pubspec.yaml

          # Configure minSdk 21 for 100% Android device compatibility
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' temp_app/android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdk = .*/minSdk = 21/g' temp_app/android/app/build.gradle 2>/dev/null || true

          # Configure debug signing for release build
          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' temp_app/android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' temp_app/android/app/build.gradle 2>/dev/null || true

      - name: Install Dependencies
        run: |
          cd ../temp_app
          flutter pub get

      - name: Generate App Icons
        run: |
          cd ../temp_app
          flutter pub run flutter_launcher_icons

      - name: Build Universal Release APK
        run: |
          cd ../temp_app
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/Tasbih-Universal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Universal-APK
          path: Tasbih-Universal.apk
