name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Project Structure
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ahm --project-name tasbih .

      - name: Setup Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Configure Android Permissions, Desugaring & Signing
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Tasbih"/g' android/app/src/main/AndroidManifest.xml

          python3 -c "
          import re

          # ১. AndroidManifest.xml আপডেট (Permissions ও Scheduled Receivers)
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              m = f.read()

          permissions = '''
    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
    <uses-permission android:name=\"android.permission.VIBRATE\"/>
    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>
    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/>
'''
          receivers = '''
        <receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver\" />
        <receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver\">
            <intent-filter>
                <action android:name=\"android.intent.action.BOOT_COMPLETED\"/>
                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\"/>
            </intent-filter>
        </receiver>
'''
          if 'POST_NOTIFICATIONS' not in m:
              m = m.replace('<application', permissions + '\n    <application')

          if 'ScheduledNotificationReceiver' not in m:
              m = m.replace('</application>', receivers + '\n    </application>')

          with open(manifest_path, 'w') as f:
              f.write(m)

          # ২. build.gradle.kts আপডেট (Desugaring ও Release Signing)
          p = 'android/app/build.gradle.kts'
          try:
              with open(p, 'r') as f:
                  c = f.read()

              c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
              c = c.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')

              if 'dependencies {' in c:
                  c = c.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")')
              else:
                  c += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'

              with open(p, 'w') as f:
                  f.write(c)
          except Exception as e:
              print('Gradle Config Error:', e)
          "

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
